[package]
name = "curam"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "zero-trust coding agent harness (Rust) — curam"

[[bin]]
name = "curam"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
curam-core = { path = "../curam-security/crates/curam-core" }
# gpui-cn 0.9 is the GPUI terminal on libghostty-vt; it pins gpui-kit 0.8,
# so the kit stays on 0.8 until the terminal lands in the kit itself.
gpui-cn = { version = "0.9.0", default-features = false, features = ["ghostty"] }
gpui-kit = "0.8.1"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
toml_edit = "0.23"
ureq = "3.4.1"
