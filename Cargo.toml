[package]
name = "curam"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "zero-trust coding agent harness (Rust) — curam"

[[bin]]
name = "curam"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
curam-core = "0.1"
ratatui = "0.30.2"
regex = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1.0.151"
toml_edit = "0.23"
ureq = "3.4.1"
